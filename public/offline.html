<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>هێڵ پچڕاوە - سیستەمی هیمۆفیلیا</title>
    <link rel="stylesheet" href="/fonts/vazirmatn.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background: #f8fafc;
            color: #0f172a;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
        }
        .box {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        img { width: 88px; height: 88px; object-fit: contain; }
        h1 { font-size: 20px; font-weight: 900; margin: 16px 0 8px; color: #be123c; }
        p { font-size: 14px; line-height: 1.9; color: #475569; margin: 0 0 20px; }
        button {
            font-family: inherit;
            font-weight: 800;
            font-size: 14px;
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            background: #e11d48;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="/images/logo.png" alt="">
        <h1>هێڵی ئینتەرنێت پچڕاوە</h1>
        <p>پەیوەندی بە سێرڤەری سیستەمەکەوە نییە. کە هێڵ گەڕایەوە، ئەم لاپەڕەیە خۆی نوێ دەبێتەوە، یان دوگمەی خوارەوە دابگرە.</p>
        <button onclick="location.reload()">هەوڵدانەوە</button>
    </div>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
